
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Don't Tell Creev - Game</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
    <!-- Internal CSS: styles written inside this HTML file -->
    <style>
        h1 { font-size: 32px; }
        footer { text-align: center; }
    </style>
</head>

<body style="color: white;"> <!-- Inline CSS -->

    <header>
        <nav>
            <ul>
                <li><a href="home.html">Home</a></li>
                <li><a href="index.html">Play the Game</a></li>
                <li><a href="aboutme.html">About the Creator</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <header>
            <h1 id="scene-title"></h1>
            <h2 id="character-name"></h2>
            <h3 id="scene-blurb"></h3>
        </header>

        <section>
            <p id="scene-text"></p>

            <img id="scene-image"
                 src=""
                 alt="Story scene"
                 width="400"

            <h3>Detective Status</h3>

            <p>Current Will:
                <span id="will-display">100</span>
            </p>

            <p>Evidence:
                <span id="evidence-display">0</span>
            </p>

            <p>Inventory:</p>
            <ul>
                <li id="inventory-display">Empty</li>
            </ul>

            <p id="message-display"></p>

    <footer>
        <p>Don't Tell Creev</p>
